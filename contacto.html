
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CB Creaciones 3D</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    
<nav>
    <a href="index.html">Inicio</a>
    <a href="productos.html">Productos</a>
    <a href="contacto.html" class="activo">Contacto</a>
</nav>


    <main>
        <h1>Contactanos</h1>
        <p>Contanos qué te gustaría imprimir en 3D.</p>

        <form id="formularioContacto" novalidate>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <p id="errorNombre"></p>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo">
            <p id="errorCorreo"></p>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono">
            <p id="errorTelefono"></p>

            <label for="mensaje">Tu consulta:</label>
            <textarea id="mensaje" name="mensaje"></textarea>
            <p id="errorMensaje"></p>

            <button type="submit">Preparar consulta</button>
        </form>

        <div id="resultado"></div>
    </main>

    <script src="js/contacto.js"></script>
</body>
</html>
